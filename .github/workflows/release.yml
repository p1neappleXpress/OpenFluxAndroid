name: Release

# A tag like v1.2.3 builds and signs the release APKs from the OpenFlux/ and
# shared/ submodules pinned in that commit, and publishes them as a GitHub
# release. "Run workflow" builds the same APKs as artifacts without
# publishing, for a dry run (unsigned unless the keystore secrets are set).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a release (tag the built commit as v<version>)'
        type: boolean
        default: false
      version:
        description: 'Version (1.2.3); required when publish is checked from a manual run'
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Version
        id: version
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; fi
          if [ -z "$v" ]; then v="0.0.0-dev"; fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::version '$v' is not X.Y.Z"; exit 1; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "Version $v, core $(git -C OpenFlux rev-parse --short HEAD)"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: OpenFlux/go.mod
          cache-dependency-path: OpenFlux/go.sum

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Add Android SDK tools to PATH
        run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e

      - name: Build the core (gomobile)
        run: bash scripts/build-android-core.sh

      - name: Tests
        run: ./gradlew --no-daemon :shared:jvmTest

      # A dry run signs too when the secret is there: its APKs install over a
      # released build, as test builds.
      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PUBLISH: ${{ inputs.publish || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            [ "$PUBLISH" = true ] && { echo "::error::ANDROID_KEYSTORE_BASE64 is required to publish a release"; exit 1; }
            echo "No keystore: unsigned APKs"; exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/openflux-release.jks"
          chmod 600 "$RUNNER_TEMP/openflux-release.jks"

      # Without the app id the build cannot sign in, and the
      # password sign-in is gone: a published release must carry it.
      - name: Require the app id to publish
        env:
          OPENFLUX_APP_ID: ${{ secrets.OPENFLUX_APP_ID }}
          PUBLISH: ${{ inputs.publish || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ -z "$OPENFLUX_APP_ID" ] && [ "$PUBLISH" = true ]; then
            echo "::warning::OPENFLUX_APP_ID is not set: this build cannot sign in (set the secret and rebuild)"
          fi

      - name: Build APKs
        env:
          OPENFLUX_APP_ID: ${{ secrets.OPENFLUX_APP_ID }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/openflux-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon -PappVersion=${{ steps.version.outputs.value }} :androidApp:assembleRelease

      - name: Verify APK signatures
        if: inputs.publish || startsWith(github.ref, 'refs/tags/v')
        run: |
          find androidApp/build/outputs/apk/release -name '*.apk' -print0 | \
            xargs -0 -r -n1 "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose

      - name: Collect
        run: |
          mkdir -p dist
          find androidApp/build/outputs/apk/release -name '*.apk' -print -exec cp {} dist/ \;
          for apk in dist/*.apk; do mv "$apk" "dist/OpenFluxAndroid-${{ steps.version.outputs.value }}-$(basename "$apk")"; done
          cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OpenFluxAndroid-${{ steps.version.outputs.value }}
          path: dist/*
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || (inputs.publish && inputs.version != '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="${GITHUB_REF#refs/tags/}"
          else tag="v${{ inputs.version }}"; fi
          notes="APK универсальный или под архитектуру устройства. Ядро: \`$(git -C OpenFlux rev-parse --short HEAD)\`. Контрольные суммы — в \`SHA256SUMS.txt\`."
          # The release shows its CHANGELOG.md section first.
          changes=$(awk -v v="${tag#v}" 'index($0, "## [")==1 { if (f) exit; f = (index($0, "## [" v "]") == 1); next } f' CHANGELOG.md)
          [ -n "$changes" ] && notes="$changes"$'\n\n'"$notes"
          if gh release view "$tag" >/dev/null 2>&1; then
            # The tag was moved to rebuild an existing release: replace its
            # assets and refresh the notes instead of failing on create.
            generated=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$tag" --jq .body)
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --title "OpenFluxAndroid $tag" --notes "$notes"$'\n\n'"$generated"
          else
            gh release create "$tag" dist/* \
              --title "OpenFluxAndroid $tag" \
              --generate-notes \
              --notes "$notes"
          fi
